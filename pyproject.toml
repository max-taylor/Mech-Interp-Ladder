[project]
name = "mech-interp-ladder"
version = "0.1.0"
description = "Hands-on mechanistic interpretability exercises"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.14.1",
  "transformer-lens==3.9.0",
  "sae-lens==6.54.5",
  "einops==0.8.2",
  "jaxtyping==0.3.11",
  "datasets==5.1.0",
  "matplotlib==3.11.2",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["exercises"]
addopts = "-ra --import-mode=importlib"
